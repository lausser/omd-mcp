# Chatbot Application Configuration
# This file is sourced by the init script as a bash script
# Place this file in etc/chatbot/chatbot.conf

# Session Management
SESSION_TIMEOUT_MINUTES=15
DEFAULT_USERNAME="chatuser"
SESSION_CLEANUP_INTERVAL_SECONDS=60

# Logging
LOG_LEVEL="INFO"  # DEBUG, INFO, WARNING, ERROR

# LLM Provider Selection
LLM_PROVIDER="openai"  # "openai" or "gemini"

# OpenAI Configuration (when LLM_PROVIDER=openai)
OPENAI_API_KEY=""
OPENAI_BASE_URL="https://api.openai.com/v1"
OPENAI_MODEL="gpt-4"

# Examples for OpenAI-compatible providers:
# OpenAI: OPENAI_BASE_URL="https://api.openai.com/v1", OPENAI_MODEL="gpt-4o"
# Local LLM (LM Studio): OPENAI_BASE_URL="http://localhost:1234/v1", OPENAI_MODEL="local-model"

# Gemini Configuration (when LLM_PROVIDER=gemini)
GEMINI_API_KEY=""
GEMINI_BASE_URL=""  # Leave empty for cloud Gemini, or set for on-premise: "https://ai.internal.corp/v1"
GEMINI_MODEL="gemini-2.5-flash"
GEMINI_VERTEXAI="false"  # Set to "true" for on-premise/enterprise deployments

# Thruk MCP Integration
# THRUK_API_KEY is auto-loaded from $OMD_ROOT/var/thruk/secret.key if not set below
# THRUK_BASE_URL is auto-configured to http://127.0.0.1/$OMD_SITE/thruk if not set below
THRUK_API_KEY=""
THRUK_BASE_URL=""

# SSL certificate verification for Thruk API calls
# Set to "false" for self-signed certificates (common in OMD installations)
# Set to "true" only if Thruk has a valid SSL certificate
THRUK_VERIFY_SSL="false"
