# Demo Naemon Configuration for Chatbot Testing
# This creates realistic monitoring data to demonstrate Thruk MCP integration

# Contact Definitions
define contact {
  contact_name                   admin
  alias                          Administrator
  email                          admin@example.com
  host_notification_period       24x7
  service_notification_period    24x7
  host_notification_options      d,u,r
  service_notification_options   w,u,c,r
  host_notification_commands     host-notify-by-email
  service_notification_commands  service-notify-by-email
}

define contact {
  contact_name                   omdadmin
  alias                          OMD Administrator
  email                          omdadmin@example.com
  host_notification_period       24x7
  service_notification_period    24x7
  host_notification_options      d,u,r
  service_notification_options   w,u,c,r
  host_notification_commands     host-notify-by-email
  service_notification_commands  service-notify-by-email
}

# Contact Group Definitions
define contactgroup {
  contactgroup_name              admins
  alias                          Administrators
  members                        admin,omdadmin
}

# Windows Server Hosts
define host {
  host_name                      winsrv01
  alias                          Windows Server 01 - Domain Controller
  address                        192.168.1.10
  use                            generic-host
  check_command                  check_dummy!0!Host is UP
  contact_groups                 admins
}

