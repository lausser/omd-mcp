# Host Groups
define hostgroup {
  hostgroup_name                 windows-servers
  alias                          Windows Servers
  members                        winsrv01,winsrv02,winsrv03,winsrv04,winsrv05
}

define hostgroup {
  hostgroup_name                 linux-servers
  alias                          Linux Servers
  members                        linuxsrv01,linuxsrv02
}

define hostgroup {
  hostgroup_name                 database-servers
  alias                          Database Servers
  members                        winsrv03,linuxsrv02
}

# Service Definitions
define service {
  service_description            CPU Load
  hostgroup_name                 windows-servers,linux-servers
  use                            generic-service
  check_command                  check_dummy!0!CPU load is 45%
}

define service {
  service_description            Memory Usage
  hostgroup_name                 windows-servers,linux-servers
  use                            generic-service
  check_command                  check_dummy!0!Memory usage is 68%
}

define service {
  service_description            Disk Space C:
  hostgroup_name                 windows-servers
  use                            generic-service
  check_command                  check_dummy!1!WARNING - 85% used
}

define service {
  service_description            Database Service
  host_name                      winsrv03,linuxsrv02
  use                            generic-service
  check_command                  check_dummy!2!CRITICAL - Database connection failed
}

define service {
  service_description            Web Service
  host_name                      winsrv04,linuxsrv01
  use                            generic-service
  check_command                  check_dummy!0!HTTP 200 OK - Response time 145ms
}

define service {
  service_description            Active Directory
  host_name                      winsrv01
  use                            generic-service
  check_command                  check_dummy!0!AD replication healthy
}

define service {
  service_description            Exchange Services
  host_name                      winsrv05
  use                            generic-service
  check_command                  check_dummy!1!WARNING - Mail queue: 127 messages
}

# Service Groups
define servicegroup {
  servicegroup_name              database-services
  alias                          Database Services
  members                        winsrv03,Database Service,linuxsrv02,Database Service
}

define servicegroup {
  servicegroup_name              web-services
  alias                          Web Services
  members                        winsrv04,Web Service,linuxsrv01,Web Service
}
