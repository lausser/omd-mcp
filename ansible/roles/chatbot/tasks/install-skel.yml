---
# Install skel files - these are copied to new OMD sites on creation
# NOTE: Only site-specific files go here (etc/chatbot configs, init scripts)
# Shared code/templates go directly to /omd/versions/default/{lib,share}

- name: Create skel directory structure
  file:
    path: "{{ omd_root }}/skel/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - etc/chatbot
    - etc/init.d
    - etc/rc.d
  tags: [skel]

- name: Copy chatbot.conf template to skel
  copy:
    src: "{{ chatbot_repo }}/omd/templates/chatbot.conf"
    dest: "{{ omd_root }}/skel/etc/chatbot/chatbot.conf"
    mode: '0644'
    owner: root
    group: root
  tags: [skel, config]

- name: Copy requirements.txt to skel
  copy:
    src: "{{ chatbot_repo }}/chatbot/requirements.txt"
    dest: "{{ omd_root }}/skel/etc/chatbot/requirements.txt"
    mode: '0644'
    owner: root
    group: root
  tags: [skel, deps]

- name: Copy requirements-optional.txt to skel
  copy:
    src: "{{ chatbot_repo }}/chatbot/requirements-optional.txt"
    dest: "{{ omd_root }}/skel/etc/chatbot/requirements-optional.txt"
    mode: '0644'
    owner: root
    group: root
  tags: [skel, deps]

- name: Create install-deps.sh script in skel
  template:
    src: ../templates/install-deps.sh.j2
    dest: "{{ omd_root }}/skel/etc/chatbot/install-deps.sh"
    mode: '0755'
    owner: root
    group: root
  tags: [skel, deps]

- name: Copy init.d script to skel
  copy:
    src: "{{ chatbot_repo }}/omd/templates/chatbot.init"
    dest: "{{ omd_root }}/skel/etc/init.d/chatbot"
    mode: '0644'
    owner: root
    group: root
  tags: [skel, init]

- name: Set etc/init.d/chatbot permissions 
  blockinfile:
    path: /omd/versions/default/share/omd/skel.permissions
    marker: "# {mark} ANSIBLE MANAGED BLOCK -->"
    insertafter: EOF
    block: |
      # chatbot
      etc/init.d/chatbot 0755

- name: Create rc.d symlink in skel
  file:
    src: ../init.d/chatbot
    dest: "{{ omd_root }}/skel/etc/rc.d/91-chatbot"
    state: link
    force: yes
  tags: [skel, init]

- name: Create README in skel/etc/chatbot
  copy:
    content: |
      # Chatbot Configuration

      This directory contains chatbot configuration and dependencies.

      ## Files

      - chatbot.conf              - Application configuration (edit this)
      - requirements.txt          - Core Python dependencies (minimal)
      - requirements-optional.txt - Optional LLM/MCP dependencies (100+ packages!)
      - install-deps.sh           - Script to install Python dependencies
      - apache.conf               - Generated by OMD hooks (do not edit)

      ## Installation

      After enabling chatbot with `omd config set CHATBOT on`, run:

          cd $OMD_ROOT/etc/chatbot
          ./install-deps.sh

      This installs ONLY core dependencies (~10 packages).

      For LLM/MCP features (WARNING: 100+ packages!):

          python3 -m pip install -r requirements-optional.txt

      ## Configuration

      Edit chatbot.conf to set:
      - LLM_PROVIDER - Choose "openai" or "gemini" (default: openai)

      For OpenAI:
      - OPENAI_API_KEY - Your OpenAI API key
      - OPENAI_BASE_URL - API endpoint (default: https://api.openai.com/v1)
      - OPENAI_MODEL - Model to use (default: gpt-4)

      For Gemini:
      - GEMINI_API_KEY - Your Gemini API key
      - GEMINI_BASE_URL - Empty for cloud, set for on-premise
      - GEMINI_MODEL - Model to use (default: gemini-2.5-flash)
      - GEMINI_VERTEXAI - "true" for enterprise, "false" for cloud

      Other settings:
      - LOG_LEVEL - Logging verbosity

      Then restart the chatbot:

          omd restart chatbot

      ## Directory Structure

      Chatbot files are installed in:
      - $OMD_ROOT/lib/python/chatbot/   - Python code (symlink to /omd/versions/default/lib/python/chatbot/)
      - $OMD_ROOT/share/chatbot/        - Templates (symlink to /omd/versions/default/share/chatbot/)
      - $OMD_ROOT/etc/chatbot/          - Site-specific configuration
      - $OMD_ROOT/local/lib/python/     - Site-specific Python packages (installed by install-deps.sh)
      - $OMD_ROOT/var/log/chatbot.log   - Logs

      Note: lib, share, bin, include are symlinks to /omd/versions/default/{lib,share,bin,include}
      Only etc, var, local, and tmp are site-specific directories.
    dest: "{{ omd_root }}/skel/etc/chatbot/README"
    mode: '0644'
    owner: root
    group: root
  tags: [skel, docs]
