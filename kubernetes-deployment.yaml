---
# Note: Secret is created from .env file by k8s-deploy.sh
# Do not hardcode secrets here!
---
# ConfigMap for chatbot.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: demodemo
data:
  chatbot.json: |
    {
      "mcpServers": {
        "thruk_mcp": {
          "transport": "http",
          "url": "http://localhost:8001"
        }
      },
      "uiConfigMcps": false
    }

---
# Deployment with two containers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-deployment
  namespace: demodemo
  labels:
    app: chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
      # ========================================================================
      # Container 1: Chatbot
      # ========================================================================
      - name: chatbot
        image: localhost/chatbot:latest
        imagePullPolicy: IfNotPresent  # Use local image (for development)

        ports:
        - containerPort: 8080
          name: http
          protocol: TCP

        env:
        - name: PORT
          value: "8080"
        - name: HOST
          value: "0.0.0.0"

        envFrom:
        - secretRef:
            name: chatbot-secrets

        volumeMounts:
        - name: chatbot-config
          mountPath: /app/chatbot.json
          subPath: chatbot.json
          readOnly: true

        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      # ========================================================================
      # Container 2: Thruk MCP
      # ========================================================================
      - name: thruk-mcp
        image: localhost/thruk-mcp:latest
        imagePullPolicy: IfNotPresent  # Use local image (for development)

        ports:
        - containerPort: 8001
          name: mcp
          protocol: TCP

        env:
        - name: MCP_SERVER_PORT
          value: "8001"

        envFrom:
        - secretRef:
            name: chatbot-secrets

        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"

        # Health check disabled - FastMCP streamable HTTP doesn't expose /health
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8001
        #   initialDelaySeconds: 15
        #   periodSeconds: 30

      volumes:
      - name: chatbot-config
        configMap:
          name: chatbot-config
          items:
          - key: chatbot.json
            path: chatbot.json

---
# Service to expose the chatbot
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: demodemo
  labels:
    app: chatbot
spec:
  type: NodePort  # Use NodePort for easy access (change to LoadBalancer for cloud)
  selector:
    app: chatbot
  ports:
  - name: http
    port: 8000        # Service port
    targetPort: 8080  # Container port
    nodePort: 30800   # External port (optional, can be auto-assigned)
    protocol: TCP
