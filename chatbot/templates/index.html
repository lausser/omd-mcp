<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thruk Chatbot</title>
    <style>
        :root {
            --header-bg: #ffffff;
            --body-bg: #f5f5f5;
            --button-bg: #555555;
            --button-hover: #666666;
            --user-msg-bg: #e0e0e0;
            --assistant-msg-bg: #ffffff;
            --border-color: #dddddd;
            --text-primary: #333333;
            --text-secondary: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--body-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--header-bg);
            color: var(--text-primary);
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .user-badge {
            background: var(--body-bg);
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .session-badge {
            font-family: monospace;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--body-bg);
        }

        .message {
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            flex-shrink: 0;
            background: var(--button-bg);
            color: white;
        }

        .message.assistant .message-avatar {
            background: var(--body-bg);
            color: var(--text-primary);
        }

        .message-content {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 4px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.user .message-content {
            background: var(--user-msg-bg);
            color: var(--text-primary);
        }

        .message.assistant .message-content {
            background: var(--assistant-msg-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .input-container {
            padding: 16px 20px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #messageInput {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            background: white;
            color: var(--text-primary);
        }

        #messageInput:focus {
            outline: none;
            border-color: var(--button-bg);
        }

        #messageInput:disabled {
            background: var(--body-bg);
            cursor: not-allowed;
        }

        #sendButton {
            padding: 10px 20px;
            background: var(--button-bg);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            background: var(--button-hover);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timeout-message {
            display: none;
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 14px;
            margin: 14px 20px;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }

        .timeout-message.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .empty-state p {
            font-size: 13px;
        }

        .typing-indicator {
            display: none;
            padding: 10px 14px;
            background: var(--assistant-msg-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: fit-content;
        }

        .typing-indicator.show {
            display: block;
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-4px);
            }
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                border: none;
            }

            .header h1 {
                font-size: 18px;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Thruk Chatbot</h1>
            <div class="user-info">
                <span>User:</span>
                <span class="user-badge" id="username">{{ username }}</span>
                <span class="session-badge">Session: {{ session_id }}</span>
            </div>
        </div>

        <div class="timeout-message" id="timeoutMessage">
            Your session has ended after inactivity. Please refresh the page to start a new session.
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <div class="empty-state-icon">&#128172;</div>
                <h3>Thruk Chatbot</h3>
                <p>Ask about hosts, services, and downtimes</p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea
                    id="messageInput"
                    placeholder="Type your message..."
                    rows="1"
                    autocomplete="off"
                ></textarea>
                <button id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <script>
        // API base path - construct from current page URL
        // E.g., if page is /demo/chatbot, API base is /demo/chatbot/api/
        const currentPath = window.location.pathname;
        const API_BASE = currentPath + (currentPath.endsWith('/') ? '' : '/') + 'api/';
        console.log('API_BASE:', API_BASE);

        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const timeoutMessage = document.getElementById('timeoutMessage');
        let sessionActive = true;
        let heartbeatIntervalId = null;

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // Send message on Enter (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        function addMessage(role, content) {
            // Remove empty state if present
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? document.getElementById('username').textContent[0].toUpperCase() : 'AI';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.textContent = content;

            // Preserve formatting for error messages with newlines/tracebacks
            if (content.includes('\n')) {
                messageContent.style.whiteSpace = 'pre-wrap';
                messageContent.style.fontFamily = 'monospace';
                messageContent.style.fontSize = '0.9em';
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.id = 'typingIndicator';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'AI';

            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator show';
            indicator.innerHTML = '<span></span><span></span><span></span>';

            typingDiv.appendChild(avatar);
            typingDiv.appendChild(indicator);

            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            if (!sessionActive) {
                return;
            }

            const message = messageInput.value.trim();
            if (!message) {
                return;
            }

            // Add user message to UI
            addMessage('user', message);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Disable input while processing
            messageInput.disabled = true;
            sendButton.disabled = true;

            // Show typing indicator
            showTypingIndicator();

            try {
                const response = await fetch(API_BASE + 'chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                hideTypingIndicator();

                console.log('Response status:', response.status);

                // Handle session expiration (401 Unauthorized)
                if (response.status === 401) {
                    console.log('Session expired, handling timeout');
                    // Session expired - try to get detailed message
                    try {
                        const errorData = await response.json();
                        console.log('Error data:', errorData);
                        const message = errorData.detail?.message || 'Your session has ended due to inactivity.';
                        handleSessionTimeout(message);
                    } catch (e) {
                        console.error('Error parsing 401 response:', e);
                        // Fallback if response body can't be parsed
                        handleSessionTimeout('Your session has ended due to inactivity.');
                    }
                    return;
                }

                if (!response.ok) {
                    // Try to get detailed error information
                    try {
                        const errorData = await response.json();
                        console.error('API Error:', errorData);

                        // If error has detailed information (admin view), display it
                        if (errorData.detail && typeof errorData.detail === 'object' && errorData.detail.error) {
                            let errorMessage = `❌ ${errorData.detail.error}\n\n`;
                            errorMessage += `Type: ${errorData.detail.type}\n`;
                            errorMessage += `Message: ${errorData.detail.message}\n\n`;
                            if (errorData.detail.traceback) {
                                errorMessage += `Traceback:\n${errorData.detail.traceback}`;
                            }
                            throw new Error(errorMessage);
                        } else if (errorData.detail) {
                            throw new Error(errorData.detail);
                        }
                    } catch (parseError) {
                        // If JSON parsing fails, throw generic error
                        if (parseError.message && parseError.message.startsWith('❌')) {
                            // Re-throw our formatted error
                            throw parseError;
                        }
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                addMessage('assistant', data.response);

            } catch (error) {
                hideTypingIndicator();
                console.error('Error sending message:', error);
                console.error('Error type:', error.name);
                console.error('Error message:', error.message);

                // Check if this is a session timeout that wasn't caught
                if (error.message && error.message.includes('401')) {
                    handleSessionTimeout('Your session has ended due to inactivity.');
                } else {
                    // Display error message (will be detailed for admins, generic for others)
                    addMessage('assistant', error.message || 'Sorry, an error occurred. Please try again.');
                }
            } finally {
                // Re-enable input
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function handleSessionTimeout(message) {
            sessionActive = false;
            timeoutMessage.classList.add('show');
            messageInput.disabled = true;
            sendButton.disabled = true;

            // Stop heartbeat interval
            if (heartbeatIntervalId) {
                clearInterval(heartbeatIntervalId);
                heartbeatIntervalId = null;
            }

            // Add system message
            const emptyState = chatContainer.querySelector('.empty-state');
            if (!emptyState) {
                const timeoutMsg = message || 'Your session has ended due to inactivity.';
                // Only append "Please refresh..." if not already in message
                const finalMsg = timeoutMsg.includes('refresh') ? timeoutMsg : timeoutMsg + ' Please refresh the page to continue.';
                addMessage('assistant', finalMsg);
            }
        }

        // Heartbeat mechanism to keep session alive
        // Calculate heartbeat interval as 50% of session timeout to ensure session stays alive
        // Session timeout is {{ session_timeout_minutes }} minutes
        const SESSION_TIMEOUT_MINUTES = {{ session_timeout_minutes }};
        const HEARTBEAT_INTERVAL = (SESSION_TIMEOUT_MINUTES * 60 * 1000) * 0.5;  // 50% of timeout
        console.log(`Session timeout: ${SESSION_TIMEOUT_MINUTES} minutes, Heartbeat interval: ${HEARTBEAT_INTERVAL/1000} seconds`);

        async function sendHeartbeat() {
            if (!sessionActive) {
                return;
            }

            try {
                const response = await fetch(API_BASE + 'session/heartbeat', {
                    method: 'POST'
                });

                if (response.status === 401) {
                    handleSessionTimeout();
                }
            } catch (error) {
                console.error('Heartbeat error:', error);
            }
        }

        // Start heartbeat interval
        heartbeatIntervalId = setInterval(sendHeartbeat, HEARTBEAT_INTERVAL);

        // Page Visibility API - handle browser tab throttling
        let lastVisibilityChange = Date.now();
        let wasHidden = false;

        document.addEventListener('visibilitychange', async function() {
            const now = Date.now();
            const hiddenDuration = now - lastVisibilityChange;

            if (document.hidden) {
                // Tab became hidden
                wasHidden = true;
                console.log('Tab hidden - browser may throttle heartbeat interval');
            } else {
                // Tab became visible
                console.log(`Tab visible again after ${Math.round(hiddenDuration/1000)} seconds`);

                if (wasHidden) {
                    // Send immediate heartbeat to keep session alive
                    console.log('Sending immediate heartbeat after tab was hidden');
                    await sendHeartbeat();
                    wasHidden = false;
                }
            }

            lastVisibilityChange = now;
        });

        // Check session status on page load
        async function checkSessionStatus() {
            try {
                const response = await fetch(API_BASE + 'session/status');
                if (response.status === 401) {
                    handleSessionTimeout();
                }
            } catch (error) {
                console.error('Session status check error:', error);
            }
        }

        // Check status on load
        checkSessionStatus();

        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
