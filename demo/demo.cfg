define service {
  service_description            os_windows_default_check_snclient
  hostgroup_name                 windows
  use                            generic-service
  check_command                  execute!$USER1$/check_nsc_web  -p CHANGEME -u https://$HOSTADDRESS$:8443 -k
  contact_groups
}

