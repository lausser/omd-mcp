[pytest]
# Pytest configuration for omd-mcp project

# Register custom markers
markers =
    slow: marks tests as slow (deselected by default, run with -m slow)
    asyncio: marks tests as async tests requiring asyncio support

# Default test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Deselect slow tests by default (run with: pytest -m slow)
addopts = -m "not slow"

# Test paths
testpaths = tests

# Asyncio configuration
asyncio_mode = auto
